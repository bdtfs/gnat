version: "2"
run:
  tests: true
linters:
  enable:
    - gocognit
    - goconst
    - gocyclo
    - gosec
    - misspell
    - revive
  settings:
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 10
    gosec:
      severity: high
      confidence: high
    revive:
      severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gocognit
          - goconst
          - gocyclo
        path: _test\.go
      - linters:
          - gosec
        text: 'G(703|704|304|306)'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
